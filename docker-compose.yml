services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host ports are parameterised and default to a block unique to this
      # project, so a neighbour on 3000 or 5432 costs nothing. Only the host
      # side moves: inside the network these still listen on 3000 and 8000.
      - "${FRONTEND_PORT:-3700}:3000"
    environment:
      NODE_ENV: production
      # Loaders and actions run inside this container and reach the backend by
      # its compose service name. The browser never calls the backend directly,
      # so no public API URL is needed (and there is no CORS to configure).
      API_URL: http://backend:8000
      # Signs the session cookie this server sets. Distinct from JWT_SECRET:
      # that one signs the token inside, this one signs the envelope, and they
      # belong to different services.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8700}:8000"
    environment:
      # "db" is the compose DNS name for the Postgres service below. Using
      # localhost here would resolve to the backend container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-notes_db}
      # Drives cookie Secure and whether /docs is served. Defaults to
      # development so a local run is unchanged; set it to production in the
      # deployed environment and both tighten together.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # No default: a fallback signing key would be a skeleton key for every
      # deployment that forgot to set one. Compose refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Where the password-reset link points. The API never serves that page, so
      # it has to name the frontend's public URL; the prod overlay sets it from
      # DOMAIN. Inside the network the frontend still listens on 3000, but the
      # link is opened from the host, so this is the host URL.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3700}}
      # Outbound mail for that link. The defaults point at the Mailpit container
      # below, which only runs under `--profile mail`. Without that profile the
      # send fails and the link is logged instead (app/services/email.py), which
      # is enough to walk through the flow locally.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Restyle <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Without these the ranker can never run under compose, whatever .env
      # says: the container only sees what is forwarded here. Unset is fine —
      # the ladder falls back to the dictionary's own ordering.
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LADDER_RANKING: ${LADDER_RANKING:-on}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # A local mail catcher for the password-reset flow: SMTP in, nothing out, a
  # web inbox to read what was sent. Behind a profile so an ordinary
  # `docker compose up` does not start it — bring it up with
  # `docker compose --profile mail up`, then read the link at
  # http://localhost:${MAILPIT_UI_PORT}.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT:-5700}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notes_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The backend runs migrations on startup, so it must not start until
    # Postgres is actually accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notes_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
